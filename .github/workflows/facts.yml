name: facts

on:
  push:
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # weekly: catches stale external facts and changes in sibling repositories

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      # Facts point into sibling repositories; check them out side by side under their own names.
      - uses: actions/checkout@v4
        with:
          path: weft-design
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: theweft/weft-verifier
          path: weft-verifier
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: theweft/weft-agent
          path: weft-agent
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: theweft/weft-parts
          path: weft-parts
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: theweft/weft-boardchecker
          path: weft-boardchecker
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: theweft/weft-website
          path: weft-website
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: theweft/weft-sim
          path: weft-sim
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: theweft/.github
          path: .github
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - name: Check facts
        working-directory: weft-design
        run: >
          nix develop ../weft-verifier --command
          cargo run --locked --manifest-path tools/factcheck/Cargo.toml -- check --repos ..
      - name: Validate requirements
        working-directory: weft-design
        run: nix develop ../weft-verifier --command just requirements
