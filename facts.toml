# Single source of truth for key values, decisions and assumptions of weft.
#
# Docs refer to an entry with an inline marker that renders as plain text on GitHub:
#   <!--f:device.m1.flash_min-->1 MB<!--/f-->
# The text between the markers must equal `text` (or `value` when there is no `text`).
# `[[fact.code]]` entries pin the value in source code of a sibling repository.
# Check with `just check`; regenerate FACTS.md with `just facts-index`.
#
# Fields:
#   id            [a-z0-9._-]+, the first segment groups the entry in FACTS.md
#   value         typed value, for tools and code checks
#   text          how the value appears in docs (optional, defaults to value)
#   kind          decision | requirement | assumption | measurement | external
#   status        draft | decided | superseded (default draft)
#   note          short explanation
#   source        URL (required for external)
#   checked       date the source was last checked (required for external)
#   measured      date of measurement (required for measurement)
#   max_age_days  warn when `checked` is older (default 180)

